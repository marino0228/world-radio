<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0e10">
  <meta name="apple-mobile-web-app-title" content="ソトオト">
  <title>ソトオト</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css?v=202610121840">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon-32.png" alt="" width="26" height="26">
      <span class="brand-text">
        <span class="brand-name">ソトオト</span>
        <span class="brand-tagline">Sounds from abroad, on the go.</span>
      </span>
    </div>
    <label class="country-pill">
      <span class="sr-only">国</span>
      <select id="country" aria-label="国"></select>
    </label>
  </header>

  <main class="app">
    <!-- 再生中のカード（上に表示）：押すと大きな再生画面を開く -->
    <div class="mini" id="mini" hidden>
      <button type="button" class="mini-open" id="mini-open" aria-label="再生画面を開く">
        <span class="mini-art" id="mini-art"></span>
        <span class="mini-text">
          <span class="mini-name" id="mini-name"></span>
          <span class="mini-sub" id="mini-sub" hidden></span>
          <span class="mini-where" id="mini-where"></span>
        </span>
      </button>
      <button type="button" class="mini-play" id="mini-play" aria-label="再生">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="play-path" d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <!-- ホーム -->
    <section id="view-home" class="view">
      <div class="chips" id="genres" role="tablist" aria-label="ジャンル"></div>

      <section class="block" id="fav-block" hidden>
        <div class="block-head">
          <div>
            <p class="eyebrow">QUICK ACCESS</p>
            <h2>お気に入り</h2>
          </div>
          <button type="button" class="pill-button" data-go="library">すべて</button>
        </div>
        <div class="grid" id="fav-grid"></div>
      </section>

      <section class="block" id="recs-block" hidden>
        <div class="block-head">
          <div>
            <p class="eyebrow">FOR YOU</p>
            <h2>あなたへのおすすめ</h2>
          </div>
        </div>
        <div class="row-track" id="recs"></div>
      </section>

      <section class="block" id="recent-block" hidden>
        <div class="block-head">
          <div>
            <p class="eyebrow">RECENT</p>
            <h2>最近聴いた局</h2>
          </div>
        </div>
        <div class="row-track" id="recent"></div>
      </section>

      <div id="rows"></div>

      <section class="block" id="grid-block" hidden>
        <div class="block-head">
          <div>
            <p class="eyebrow" id="grid-eyebrow">GENRE</p>
            <h2 id="grid-title"></h2>
          </div>
          <button type="button" class="pill-button" id="grid-back">ホームへ</button>
        </div>
        <div class="grid" id="stations"></div>
        <button id="more" class="more" hidden>さらに表示</button>
      </section>
      <p class="message" id="message"></p>
      <footer class="credit">
        局の情報: <a href="https://www.radio-browser.info/" target="_blank" rel="noopener">Radio Browser</a>（https で配信している局のみ）・ジャケット画像: Apple iTunes
      </footer>
    </section>

    <!-- 検索 -->
    <section id="view-search" class="view" hidden>
      <h2 class="view-title">検索</h2>
      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input id="search-input" type="search" placeholder="局名で探す（例: J-WAVE、BBC、Jazz）" autocomplete="off" enterkeyhint="search" aria-label="局名で探す">
      </label>
      <p class="message" id="search-message">世界中のラジオ局から、名前の一部で探せます</p>
      <div class="grid" id="search-results"></div>
    </section>

    <!-- ライブラリ -->
    <section id="view-library" class="view" hidden>
      <h2 class="view-title">ライブラリ</h2>
      <section class="block">
        <div class="block-head"><h2>お気に入り</h2></div>
        <div class="grid" id="library-favs"></div>
      </section>
      <section class="block">
        <div class="block-head"><h2>最近聴いた局</h2></div>
        <div class="grid" id="library-recent"></div>
      </section>
    </section>
  </main>

  <nav class="tabbar" aria-label="移動">
    <button type="button" data-go="home" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>ホーム</span>
    </button>
    <button type="button" id="genre-nav" aria-haspopup="dialog" aria-controls="genre-sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>
      <span>ジャンル</span>
    </button>
    <button type="button" data-go="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      <span>検索</span>
    </button>
    <button type="button" data-go="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      <span>ライブラリ</span>
    </button>
  </nav>

  <!-- 大きな再生画面 -->
  <section class="player" id="player" role="dialog" aria-modal="true" aria-label="再生中" hidden>
    <div class="player-bg" id="player-bg"></div>
    <div class="player-inner">
      <div class="player-top">
        <button type="button" class="icon-button" id="player-close" aria-label="閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 8.6 12 15l6.4-6.4L19.8 10 12 17.8 4.2 10z"/></svg>
        </button>
        <p class="eyebrow">NOW PLAYING</p>
        <span class="live-pill">● LIVE</span>
      </div>
      <div class="player-art" id="player-art"></div>
      <div class="player-text">
        <p class="player-title" id="player-title"></p>
        <p class="player-sub" id="player-sub"></p>
        <p class="player-meta" id="player-meta"></p>
        <div class="player-genres" id="player-genres"></div>
      </div>
      <div class="live-bar"><span></span></div>
      <div class="player-controls">
        <button type="button" class="icon-button" id="now-star" aria-label="お気に入りに登録">☆</button>
        <button type="button" class="big-play" id="play" aria-label="再生">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="play-path" d="M8 5v14l11-7z"/></svg>
        </button>
        <button type="button" class="icon-button" id="sleep-toggle" aria-expanded="false" aria-controls="sleep-options" aria-label="おやすみタイマー">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </div>
      <p class="now-status" id="now-status" role="status"></p>
      <div class="timer-row" id="timer">
        <span class="timer-chip" id="sleep-label">おやすみタイマー</span>
        <button type="button" class="timer-chip" id="pomodoro-toggle" aria-pressed="false" title="25分集中・5分休憩をくり返します。動作中に押すと終了します">
          <span id="pomodoro-label">ポモドーロ</span>
        </button>
      </div>
      <div class="sleep-options" id="sleep-options" hidden>
        <button data-minutes="0">オフ</button>
        <button data-minutes="15">15分</button>
        <button data-minutes="30">30分</button>
        <button data-minutes="45">45分</button>
        <button data-minutes="60">60分</button>
        <button data-minutes="90">90分</button>
      </div>
      <div class="up-next">
        <p class="eyebrow">MORE LIKE THIS</p>
        <h3>同じジャンルの局</h3>
        <ul class="queue" id="queue"></ul>
      </div>
    </div>
  </section>

  <div class="sheet" id="genre-sheet" role="dialog" aria-modal="true" aria-labelledby="genre-sheet-title" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <div>
          <p class="eyebrow">GENRE</p>
          <h2 id="genre-sheet-title">ジャンルを選ぶ</h2>
        </div>
        <button type="button" class="sheet-close" id="genre-sheet-close" aria-label="閉じる">×</button>
      </div>
      <div class="sheet-genres" id="sheet-genres"></div>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script type="module" src="app.js?v=202610121840"></script>
</body>
</html>
